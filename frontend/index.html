<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoticeBoardTracker</title>
    <!-- Set the theme BEFORE the page paints, so there is no flash of the wrong
         theme on load. Remembered choice wins; otherwise follow the OS setting. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nbt_theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
